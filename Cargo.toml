[workspace]
resolver = "2"
members = [
    "crates/stride-core",
    "crates/stride-kvcache",
    "crates/stride-model",
    "crates/stride-sched",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/4ktluffy/stride"

[workspace.dependencies]
stride-core = { path = "crates/stride-core" }
stride-kvcache = { path = "crates/stride-kvcache" }
stride-model = { path = "crates/stride-model" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
