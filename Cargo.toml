[workspace]
resolver = "2"
members = [
    "crates/stride-core",
    "crates/stride-engine",
    "crates/stride-kvcache",
    "crates/stride-backend",
    "crates/stride-model",
    "crates/stride-sched",
    "crates/stride-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# int::is_multiple_of, used in the divisibility checks, stabilised in 1.87.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/4ktluffy/stride"

[workspace.dependencies]
stride-core = { path = "crates/stride-core" }
stride-kvcache = { path = "crates/stride-kvcache" }
stride-model = { path = "crates/stride-model" }
stride-sched = { path = "crates/stride-sched" }
stride-backend = { path = "crates/stride-backend" }
stride-engine = { path = "crates/stride-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
