name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Debug assertions are load-bearing here: the KV cache checks its
      # live/cached/free partition on every scheduler step under cfg(debug).
      - name: Test (debug assertions on)
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

      - name: Capacity planner runs
        run: cargo run -p stride-model --example plan

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch: the gate and its negative controls exercise the checking
      # logic, not the hardware, so they must never be skipped for want of a GPU.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e './python[dev]'

      - name: Every module imports
        run: |
          python -c "import stride_worker.protocol, stride_worker.cache, stride_worker.layers"
          python -c "import stride_worker.model, stride_worker.worker"
          python -c "import stride_worker.kernels.rmsnorm, stride_worker.kernels.paged_attn, stride_worker.kernels.w4a16"
          python -c "import stride_worker.autotune.gate, stride_worker.autotune.search"
          python -c "import stride_worker.distributed, stride_worker.diagnose.equivalence"
          python -c "import stride_worker.diagnose.prefill, stride_worker.diagnose.tp, stride_worker.diagnose.attention"

      # The load-bearing check: the gate must reject every known-broken kernel.
      # If this passes vacuously, nothing the gate ever approves means anything.
      - name: Correctness gate rejects broken kernels
        run: stride-autotune verify --device cpu --dtype float32

      - name: Tests
        run: pytest python/tests -q
